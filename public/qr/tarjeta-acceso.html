<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso al Sistema de Activos</title>
  <style>
    :root { color: #0a2146; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef4fb; }
    .card { width: min(90vw, 430px); box-sizing: border-box; padding: 34px; text-align: center; border: 1px solid #d5e3f4; border-radius: 28px; background: white; box-shadow: 0 18px 50px rgba(10,33,70,.14); }
    .eyebrow { margin: 0; color: #2d6bb5; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 27px; }
    p { margin: 0; color: #52647d; line-height: 1.5; }
    .qr { display: block; width: min(100%, 320px); margin: 25px auto 20px; }
    .url { display: inline-block; max-width: 100%; overflow-wrap: anywhere; color: #174a86; font-size: 12px; font-weight: 700; }
    @media print { body { background: white; } .card { box-shadow: none; } }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Municipalidad · Gestión patrimonial</p>
    <h1>Sistema de Activos</h1>
    <p>Escanea este código para ingresar directamente al sistema.</p>
    <img class="qr" src="sistema-activos-qr.svg" alt="Código QR de acceso al Sistema de Activos">
    <span class="url">frondendactivos-production.up.railway.app</span>
  </main>
</body>
</html>
