<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso al Sistema de Activos</title>
  <style>
    :root { color: #0a2146; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 15% 10%, #dcecff, transparent 35%), #eef4fb; }
    .card { width: min(92vw, 450px); box-sizing: border-box; overflow: hidden; text-align: center; border: 1px solid #d5e3f4; border-radius: 30px; background: white; box-shadow: 0 22px 60px rgba(10,33,70,.18); }
    .hero { padding: 28px 30px 24px; color: white; background: linear-gradient(135deg, #071b3b, #174a86 68%, #2d6bb5); }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border: 1px solid rgba(255,255,255,.28); border-radius: 11px; background: rgba(255,255,255,.12); }
    .eyebrow { margin: 20px 0 0; color: #b9d8ff; font-size: 10px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 7px 0 6px; font-size: 28px; letter-spacing: -.03em; }
    .hero p { margin: 0; color: #dcecff; line-height: 1.5; }
    .content { padding: 26px 30px 28px; }
    .scan-label { display: inline-block; padding: 7px 12px; border-radius: 999px; color: #174a86; background: #eaf2fb; font-size: 10px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; }
    .qr { display: block; width: min(100%, 300px); margin: 19px auto 17px; }
    .steps { display: flex; justify-content: center; gap: 15px; margin: 0 auto 18px; color: #64748b; font-size: 11px; font-weight: 700; }
    .step { display: flex; align-items: center; gap: 5px; }
    .step b { display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; color: white; background: #2d6bb5; font-size: 10px; }
    .url { display: inline-block; max-width: 100%; overflow-wrap: anywhere; color: #174a86; font-size: 11px; font-weight: 800; }
    .footer { margin-top: 19px; color: #94a3b8; font-size: 10px; }
    @media print { body { background: white; } .card { box-shadow: none; } }
  </style>
</head>
<body>
  <main class="card">
    <header class="hero">
      <div class="brand"><span class="brand-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4.5 7.5 7.5 4 7.5-4M12 11.5V21"/></svg></span>Gestión patrimonial</div>
      <p class="eyebrow">Acceso institucional</p>
      <h1>Sistema de Activos</h1>
      <p>Control, inventario y seguimiento de bienes municipales.</p>
    </header>
    <section class="content">
      <span class="scan-label">Escanea para ingresar</span>
      <img class="qr" src="sistema-activos-qr.svg" alt="Código QR de acceso al Sistema de Activos">
      <div class="steps"><span class="step"><b>1</b> Abre la cámara</span><span class="step"><b>2</b> Apunta al código</span></div>
      <span class="url">frondendactivos-production.up.railway.app</span>
      <div class="footer">Presentación del sistema · Municipalidad</div>
    </section>
  </main>
</body>
</html>
